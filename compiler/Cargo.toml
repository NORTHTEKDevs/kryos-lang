[workspace]
resolver = "2"
members = [
    "crates/kryos-errors",
    "crates/kryos-ast",
    "crates/kryos-lexer",
    "crates/kryos-parser",
    "crates/kryos-types",
    "crates/kryos-ownership",
    "crates/kryos-capabilities",
    "crates/kryos-mir",
    "crates/kryos-codegen-cranelift",
    "crates/kryos-codegen-llvm",
    "crates/kryos-codegen-wasm",
    "crates/kryos-linker",
    "crates/kryos-bindgen",
    "crates/kryos-stdlib-native",
    "crates/kryos-driver",
    "crates/kryos-cli",
    "crates/kryos-lsp",
    "crates/kryos-package",
    "crates/kryos-rt",
    "crates/kryos-doc",
    "crates/kryos-test-runner",
    "crates/kryos-fmt",
]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0-beta.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NORTHTEKDevs/kryos-lang"
homepage = "https://github.com/NORTHTEKDevs/kryos-lang"
authors = ["NORTHTEK <info@northtek.io>"]

[workspace.dependencies]
# Internal crates
kryos-errors = { path = "crates/kryos-errors" }
kryos-ast = { path = "crates/kryos-ast" }
kryos-lexer = { path = "crates/kryos-lexer" }
kryos-parser = { path = "crates/kryos-parser" }
kryos-types = { path = "crates/kryos-types" }
kryos-ownership = { path = "crates/kryos-ownership" }
kryos-capabilities = { path = "crates/kryos-capabilities" }
kryos-mir = { path = "crates/kryos-mir" }
kryos-codegen-cranelift = { path = "crates/kryos-codegen-cranelift" }
kryos-codegen-llvm = { path = "crates/kryos-codegen-llvm" }
kryos-codegen-wasm = { path = "crates/kryos-codegen-wasm" }
kryos-linker = { path = "crates/kryos-linker" }
kryos-bindgen = { path = "crates/kryos-bindgen" }
kryos-stdlib-native = { path = "crates/kryos-stdlib-native" }
kryos-driver = { path = "crates/kryos-driver" }
kryos-cli = { path = "crates/kryos-cli" }
kryos-lsp = { path = "crates/kryos-lsp" }
kryos-package = { path = "crates/kryos-package" }
kryos-rt = { path = "crates/kryos-rt" }
kryos-doc = { path = "crates/kryos-doc" }
kryos-test-runner = { path = "crates/kryos-test-runner" }
kryos-fmt = { path = "crates/kryos-fmt" }

# External dependencies
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
cranelift-jit = "0.116"
cranelift-module = "0.116"
cranelift-native = "0.116"
cranelift-object = "0.116"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
regex = "1"
crossterm = "0.28"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
criterion = { version = "0.5", features = ["html_reports"] }
rustyline = "14"

# Dev profile: reduce debug build RAM from ~48GB by optimizing heavy deps
[profile.dev]
opt-level = 1

[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.cranelift-frontend]
opt-level = 2

[profile.dev.package.cranelift-codegen-meta]
opt-level = 2

[profile.dev.package.cranelift-isle]
opt-level = 2

[profile.dev.package."*"]
opt-level = 1

# Release profile: tuned for small target dir and reasonable build time.
#
# Compared to the cargo default:
# - debug = false       : no debuginfo in rlibs (drops the target dir from
#                         ~6 GB down to ~1-1.5 GB on a typical build).
# - strip = "symbols"   : strips final binary symbols (~15 MB -> ~10 MB).
# - incremental = false : release shouldn't pay incremental's disk cost.
# - debug-assertions    : off in release (Kryos compiler is heavily exercised
#   / overflow-checks     and these are pure speed/size wins).
#
# LTO is intentionally left at cargo's default (off) so cold release builds
# stay around ~2 minutes at -j 2. Use the `dist` profile below when you want
# the smallest possible binary for distribution -- it enables fat LTO and
# single-codegen-unit at the cost of a much longer build.
[profile.release]
opt-level = 3
debug = false
strip = "symbols"
codegen-units = 16
incremental = false
debug-assertions = false
overflow-checks = false

# Distribution profile: smallest possible binary. Slow to compile.
# Inherits release defaults, then tightens further.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
