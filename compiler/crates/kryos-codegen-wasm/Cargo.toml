[package]
name = "kryos-codegen-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly codegen backend for the Kryos compiler"

[dependencies]
kryos-mir = { workspace = true }
kryos-driver = { workspace = true }
wasm-encoder = "0.221"
# Validator companion to wasm-encoder, same version line. Used ONLY to refuse
# emitting a structurally invalid module -- see `emit_module` (LEDGER item 27).
wasmparser = "0.221"
