[package]
name = "kryos-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kryos-lexer = { path = "../crates/kryos-lexer" }
kryos-parser = { path = "../crates/kryos-parser" }
kryos-types = { path = "../crates/kryos-types" }
kryos-ast = { path = "../crates/kryos-ast" }
kryos-errors = { path = "../crates/kryos-errors" }

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
test = false
doc = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_typechecker"
path = "fuzz_targets/fuzz_typechecker.rs"
test = false
doc = false
