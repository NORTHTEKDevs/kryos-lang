name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "compiler"

      - name: Build (release)
        working-directory: compiler
        run: cargo build --release -j 4

      - name: Test (release)
        working-directory: compiler
        run: cargo test --release -j 4

      - name: Clippy (release)
        working-directory: compiler
        run: cargo clippy --release -j 4 -- -D warnings

      - name: Format check
        working-directory: compiler
        run: cargo fmt -- --check

      - name: Smoke test (kryos run)
        working-directory: compiler
        shell: bash
        run: |
          ./target/release/kryos run tests/smoke.kry > smoke_output.txt
          printf "30\n2\nKryos\n" > expected.txt
          diff expected.txt smoke_output.txt
