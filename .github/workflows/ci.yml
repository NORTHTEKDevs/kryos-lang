name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "compiler"

      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y libsqlite3-dev libssl-dev pkg-config

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (release)
        working-directory: compiler
        run: cargo build --release -j 4

      - name: Test (release)
        working-directory: compiler
        run: cargo test --release -j 4

      - name: Clippy (release)
        working-directory: compiler
        run: cargo clippy --release -j 4 -- -D warnings

      - name: Format check
        working-directory: compiler
        run: cargo fmt -- --check

      - name: Smoke test (kryos run)
        working-directory: compiler
        shell: bash
        run: |
          ./target/release/kryos run tests/smoke.kry > smoke_output.txt
          printf "30\n2\nKryos\n" > expected.txt
          diff expected.txt smoke_output.txt

      - name: Example smoke tests (kryos run examples/*)
        working-directory: compiler
        shell: bash
        # Run a curated set of examples end-to-end. Each example declares its
        # expected output via `// expect-stdout:` lines; we just require a
        # successful exit here. This is the cheapest regression gate against
        # codegen / linker / runtime breakage.
        run: |
          set -e
          for ex in hello fibonacci calculator word_count shapes; do
            echo "== examples/$ex.kry =="
            ./target/release/kryos run ../examples/$ex.kry > /dev/null
          done

      - name: Showcase smoke tests
        working-directory: compiler
        shell: bash
        # The showcase apps exercise wider stdlib surface area: JSON, HTTP
        # construction, file I/O, channels, markdown rendering. We compile
        # and run the ones that exit cleanly without external services.
        run: |
          set -e
          for ex in markdown kvdb ssg worker_pool; do
            echo "== showcase/$ex.kry =="
            ./target/release/kryos run ../examples/showcase/$ex.kry > /dev/null
          done

      - name: Package manager smoke (local path deps)
        working-directory: compiler
        shell: bash
        run: |
          set -e
          TMP=$(mktemp -d)
          cd "$TMP"
          "$GITHUB_WORKSPACE/compiler/target/release/kryos" pkg init mylib > /dev/null
          "$GITHUB_WORKSPACE/compiler/target/release/kryos" pkg init myapp > /dev/null
          printf 'pub fn add_int(a: i64, b: i64) -> i64 { return a + b }\n' > mylib/src/lib.kry
          printf 'use mylib::{add_int}\nfn main() { println(to_string(add_int(2, 3))) }\n' > myapp/src/main.kry
          cd myapp
          "$GITHUB_WORKSPACE/compiler/target/release/kryos" pkg add ../mylib
          "$GITHUB_WORKSPACE/compiler/target/release/kryos" pkg install
          out=$("$GITHUB_WORKSPACE/compiler/target/release/kryos" run src/main.kry)
          [ "$out" = "5" ] || { echo "expected 5 got '$out'"; exit 1; }
          echo "pkg smoke OK"
