name: Publish VS Code extension
# One-time setup (owner):
#   1. Create the publisher (web, once): https://marketplace.visualstudio.com/manage
#      -> "Create publisher" -> id: northtekdevs (must match editors/vscode/package.json).
#   2. Mint a PAT: https://dev.azure.com -> User settings -> Personal access tokens
#      -> New Token -> Organization: "All accessible organizations",
#      Scopes: Marketplace -> Manage. Copy it.
#   3. gh secret set VSCE_PAT -R NORTHTEKDevs/kryos-lang
# Then run this workflow (Actions tab -> Publish VS Code extension -> Run),
# or it runs automatically at the end of release.yml: release.yml's
# `publish-vscode` job calls this file (`workflow_call`) once the GitHub
# Release exists and carries kryos-vscode.vsix. Prerelease tags (-beta. /
# -rc.) are skipped there.
#
# Why not `on: release: types: [published]`: release.yml creates the release
# with the default GITHUB_TOKEN, and GitHub never starts a workflow from an
# event raised by GITHUB_TOKEN (loop prevention), so that trigger never fired
# for any release this repo cut itself (A23).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose .vsix to publish (e.g. v1.3.0)"
        required: true
      verify_only:
        description: "Only verify the stored VSCE_PAT (no publish) -- use after rotating the token"
        default: "false"
        required: false
  workflow_call:
    inputs:
      tag:
        description: "Release tag whose .vsix to publish"
        type: string
        required: true
      verify_only:
        type: string
        default: "false"
        required: false
    secrets:
      VSCE_PAT:
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify stored PAT only (rotation check)
        if: ${{ inputs.verify_only == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce verify-pat northtekdevs -p "$VSCE_PAT" \
            && echo "VSCE_PAT is valid for publisher northtekdevs"
      - name: Resolve tag
        if: ${{ inputs.verify_only != 'true' }}
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Download .vsix from the release
        if: ${{ inputs.verify_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.tag.outputs.tag }}" -R "${{ github.repository }}" -p "kryos-vscode.vsix"
      - name: Publish to the marketplace
        if: ${{ inputs.verify_only != 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret not set -- see the setup comment at the top of this workflow"
            exit 1
          fi
          npx --yes @vscode/vsce publish --packagePath kryos-vscode.vsix -p "$VSCE_PAT"
