name: Cross-target build

# Cheap "does it still compile?" matrix across multiple targets. We don't run
# tests here -- they're covered by the main CI on linux/windows. This workflow
# is the early-warning system for codegen / linker regressions when we add
# platform-specific code in kryos-rt or kryos-stdlib-native.

on:
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "compiler"
          key: ${{ matrix.target }}

      - name: Install native build tools
        run: |
          sudo apt-get update -q
          # Required for the linux-musl, windows-gnu, and aarch64 targets.
          sudo apt-get install -y musl-tools mingw-w64 gcc-aarch64-linux-gnu \
                                  libsqlite3-dev libssl-dev pkg-config

      - name: cargo check (release, --target)
        working-directory: compiler
        env:
          # mingw cross-compiler for the windows-gnu target
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          # cross-linker for the aarch64 target
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --release --target ${{ matrix.target }} -j 4
