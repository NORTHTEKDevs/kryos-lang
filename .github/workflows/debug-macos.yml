name: debug-macos-parity
on: workflow_dispatch
jobs:
  repro:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM (Homebrew)
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
      - name: Build (release)
        working-directory: compiler
        run: cargo build --release -j 2
      - name: Run real parity harness with stderr dumping
        shell: bash
        run: |
          # Isolated repro builds PASS; the failure needs the harness's own
          # context. Patch the harness (runner-local) to dump captured build
          # stderr on every FAIL_BUILD classification.
          sed -i.bak 's|llvm_err="$(head -c 4000 "$tmp_err")"|llvm_err="$(head -c 4000 "$tmp_err")"; echo "===STDERR($name)==="; head -40 "$tmp_err"|' tests/parity/run_parity.sh
          grep -c "STDERR" tests/parity/run_parity.sh
          bash tests/parity/run_parity.sh 2>&1 | grep -B2 -A42 "===STDERR" || true
          echo "harness done"
