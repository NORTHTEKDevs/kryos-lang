name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kryos-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kryos-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kryos-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kryos-macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "compiler"

      - name: Build release binary
        working-directory: compiler
        run: cargo build --release --target ${{ matrix.target }} -j 4

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp compiler/target/${{ matrix.target }}/release/kryos dist/
          cp README.md LICENSE CHANGELOG.md dist/
          cp -r examples dist/
          cp -r compiler/stdlib dist/
          tar czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp compiler/target/${{ matrix.target }}/release/kryos.exe dist/
          cp README.md LICENSE CHANGELOG.md dist/
          cp -r examples dist/
          cp -r compiler/stdlib dist/
          7z a ${{ matrix.artifact }}.zip ./dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
