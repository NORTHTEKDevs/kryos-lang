name: debug-linux-csv
on: workflow_dispatch
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM + valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang valgrind
      - name: Build (release)
        working-directory: compiler
        run: cargo build --release -j 2
      - name: Repro test_csv on both backends + valgrind
        shell: bash
        run: |
          set -x
          export KRYOS_STDLIB_DIR="$PWD/compiler/stdlib"
          K="$PWD/compiler/target/release/kryos"
          set +e
          echo "==== JIT ===="
          "$K" run tests/smoke/test_csv.kry; echo "jit rc=$?"
          echo "==== AOT build ===="
          "$K" build --release tests/smoke/test_csv.kry -o /tmp/csv.bin && echo "built"
          echo "==== AOT run (raw) ===="
          /tmp/csv.bin; echo "aot rc=$?"
          echo "==== minimal to_line repro ===="
          cat > /tmp/tl.kry <<'KRY'
          fn build(fields: [str]) -> str {
              let mut out = ""
              let mut idx = 0
              while idx < len(fields) {
                  if idx > 0 { out = out + "," }
                  out = out + fields[idx]
                  idx = idx + 1
              }
              return out
          }
          fn main() {
              let mut xs: [str] = []
              xs = push(xs, "a")
              xs = push(xs, "b")
              xs = push(xs, "c")
              println(build(xs))
          }
          KRY
          sed -i 's/^          //' /tmp/tl.kry
          echo "-- tl JIT --"; "$K" run /tmp/tl.kry; echo "rc=$?"
          "$K" build --release /tmp/tl.kry -o /tmp/tl.bin && echo "-- tl AOT --" && /tmp/tl.bin; echo "rc=$?"
          echo "==== AOT under valgrind ===="
          valgrind --error-exitcode=0 --leak-check=no --track-origins=yes /tmp/csv.bin 2>&1 | grep -A6 -iE "invalid|freed|abort|error summary|by 0x|at 0x" | head -50 || true
